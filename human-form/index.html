<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Human form</title>
    <style>
      html, body { margin: 0; height: 100%; background: #e9e6e1; }
      canvas { display: block; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { createHuman } from './human.js';

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe9e6e1);

      const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
      camera.position.set(0, 1.15, 4.6);
      camera.lookAt(0, 0.9, 0);

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8078, 1.1));
      const key = new THREE.DirectionalLight(0xffffff, 2.2);
      key.position.set(2, 4, 3);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.2, bottom: -0.5 });
      scene.add(key);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(3, 64),
        new THREE.ShadowMaterial({ opacity: 0.18 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const human = createHuman();
      scene.add(human);
      window.human = human;

      const params = new URLSearchParams(location.search);
      const fixed = params.has('angle') ? Number(params.get('angle')) : null;

      function resize() {
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', resize);
      resize();

      renderer.setAnimationLoop((t) => {
        human.rotation.y = fixed ?? t * 0.0004;
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
